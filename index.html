<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docker Gordon 操作邊界地圖</title>
<meta name="description" content="Docker Desktop Gordon AI 服務的操作邊界實驗記錄與分層防護線視覺化">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  color-scheme:light;
  --bg-rgb:245 243 240;--paper-rgb:252 249 244;--paper-cool-rgb:246 242 236;--ink-rgb:40 38 35;--shadow-rgb:77 65 55;
  --text-primary:rgb(var(--ink-rgb) / .98);--text-secondary:rgb(var(--ink-rgb) / .84);--text-muted:rgb(var(--ink-rgb) / .62);--text-faint:rgb(var(--ink-rgb) / .40);
  --draft-line:rgb(var(--ink-rgb) / .62);--draft-line-heavy:rgb(var(--ink-rgb) / .24);
  --bg-primary:rgb(var(--bg-rgb));--bg-secondary:rgb(var(--paper-cool-rgb) / .55);--bg-card:rgb(255 255 255 / .42);--bg-card-hover:rgb(255 255 255 / .68);
  --print-accent:#6e7884;--accent-blue:var(--print-accent);--accent-cyan:var(--print-accent);--accent-green:var(--print-accent);--accent-amber:var(--print-accent);--accent-red:var(--print-accent);--accent-purple:var(--print-accent);--accent-pink:var(--print-accent);--accent-teal:var(--print-accent);
  --border-subtle:var(--draft-line);--border-active:var(--draft-line-heavy);
  --font-serif:"Noto Serif TC","Shippori Mincho","Yu Mincho","PingFang TC",serif;
  --font-sans:"Noto Sans TC","Hiragino Kaku Gothic ProN","PingFang TC",sans-serif;
  --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --step--1:.75rem;--step-0:.875rem;--step-1:1.125rem;--step-2:1.5rem;--step-3:2rem;--step-4:3rem;
  --paper-blur:16px;
  --paper-shadow:0 24px 48px rgb(var(--shadow-rgb) / .08),0 8px 16px rgb(var(--shadow-rgb) / .04),0 1px 2px rgb(var(--shadow-rgb) / .02);
  --paper-edge:inset 0 1px 0 rgb(255 255 255 / .8),inset 0 -1px 0 rgb(145 129 113 / .15);
  --ink-relief:.015em .025em 0 rgb(95 78 63 / .08),.04em .06em .10em rgb(95 78 63 / .05);
  --light:1;--dynamic-light-x:68%;--dynamic-light-y:22%;--tilt-x:0deg;--tilt-y:0deg;
  --radius:0;--radius-lg:0;
}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);background-color:var(--bg-primary);background-image:linear-gradient(rgb(var(--ink-rgb) / .04) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--ink-rgb) / .04) 1px,transparent 1px),linear-gradient(rgb(var(--ink-rgb) / .02) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--ink-rgb) / .02) 1px,transparent 1px);background-size:100px 100px,100px 100px,10px 10px,10px 10px;background-position:-1px -1px;color:var(--text-primary);line-height:1.85;min-height:100vh;font-weight:300;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.045;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");mix-blend-mode:multiply;z-index:9999}
code,.mono{font-family:var(--font-mono)}
.draft-edge-label{position:fixed;left:16px;top:0;bottom:0;width:24px;writing-mode:vertical-rl;text-orientation:mixed;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;color:var(--text-faint);border-right:1px solid var(--draft-line);z-index:10}
.decor-paper{position:fixed;z-index:0;width:112px;height:76px;background:rgb(var(--paper-rgb));border:1px solid rgb(var(--ink-rgb) / .18);box-shadow:0 10px 24px rgb(var(--shadow-rgb) / .08);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s ease;pointer-events:auto}
.decor-paper::before{content:"";position:absolute;left:18px;right:18px;top:22px;border-top:1px solid rgb(var(--ink-rgb) / .42)}
.decor-paper::after{content:"";position:absolute;left:18px;right:36px;top:38px;border-top:1px solid var(--print-accent)}
.decor-paper:hover{transform:translateY(-18px) rotate(var(--lift-rot,4deg));box-shadow:0 22px 36px rgb(var(--shadow-rgb) / .13)}
.decor-paper.p1{right:5vw;top:132px;transform:rotate(5deg)}
.decor-paper.p1:hover{--lift-rot:9deg}
.decor-paper.p2{left:7vw;top:48vh;width:92px;height:64px;transform:rotate(-7deg)}
.decor-paper.p2:hover{--lift-rot:-13deg}
.decor-paper.p3{right:10vw;bottom:90px;width:128px;height:86px;transform:rotate(-3deg)}
.decor-paper.p3:hover{--lift-rot:5deg}
@media(max-width:900px){.decor-paper{display:none}}

/* Header */
.hero{position:relative;width:min(1400px,calc(100% - 100px));margin:56px auto 24px;padding:84px 56px 96px;text-align:left;overflow:hidden;background:linear-gradient(145deg,rgb(var(--paper-rgb)),rgb(var(--paper-cool-rgb) / .72));display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-rows:auto auto 1fr;gap:0 54px;min-height:45svh;align-items:start;z-index:120;box-shadow:var(--paper-edge),var(--paper-shadow);transition:min-height .58s cubic-bezier(.2,.8,.2,1),padding .58s cubic-bezier(.2,.8,.2,1),margin .58s cubic-bezier(.2,.8,.2,1),transform .18s ease,opacity .38s ease}
.hero::before,section::before,.layer-card::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 200px at var(--dynamic-light-x) var(--dynamic-light-y),rgb(255 255 255 / calc(.30 * var(--light))),transparent 52%),linear-gradient(180deg,rgb(255 255 255 / .16),transparent 28%);pointer-events:none;z-index:0}
.hero.dynamic-paper,section.dynamic-paper,.flow-page.dynamic-paper{transform:perspective(1200px) rotateX(var(--tilt-y)) rotateY(var(--tilt-x)) rotate(var(--base-rot,0deg))}
.hero > *,section > *,.flow-page > *,.layer-card > *{position:relative;z-index:1}
.hero h1{grid-column:1;grid-row:1;font-family:var(--font-serif);font-size:var(--step-4);font-weight:500;color:var(--text-primary);letter-spacing:.02em;line-height:1.2;padding:0;margin:0;text-shadow:.026em .045em 0 rgb(95 78 63 / .14),.07em .09em .14em rgb(95 78 63 / .12),0 0 .08em rgb(255 252 248 / .28)}
.hero h1::before{content:"Docker Gordon Boundary Map";display:block;font-family:var(--font-mono);font-size:10px;color:var(--print-accent);letter-spacing:.15em;margin-bottom:8px;text-shadow:none;text-transform:uppercase}
.hero .mark{display:inline-flex;align-items:center;justify-content:center;width:1.3rem;height:1.3rem;margin-right:.35rem;color:var(--accent-cyan);vertical-align:-.18rem}
.hero .subtitle{grid-column:1;grid-row:2;color:var(--text-secondary);font-size:var(--step-0);line-height:2;padding:0;margin-top:18px;max-width:none;white-space:nowrap;text-shadow:var(--ink-relief)}
.hero .subtitle::before{content:"";display:none}
.hero-banner{grid-column:1 / -1;grid-row:3;margin:44px 0 -26px;align-self:end;overflow:hidden;aspect-ratio:2385 / 941;background:rgb(var(--ink-rgb) / .08);box-shadow:0 18px 34px rgb(var(--shadow-rgb) / .12);opacity:.9;transition:opacity .36s ease,transform .58s cubic-bezier(.2,.8,.2,1),max-height .58s cubic-bezier(.2,.8,.2,1)}
.hero-banner img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.hero-whale{display:none;grid-column:1;grid-row:3;align-self:end;justify-self:start;width:min(690px,100%);margin:48px 0 -20px -12px;pointer-events:none;mix-blend-mode:multiply;opacity:.9;will-change:left,top;transition:width .58s cubic-bezier(.2,.8,.2,1),opacity .38s ease,filter .38s ease}
.hero-whale-art{display:block;animation:whaleSwim 18s ease-in-out infinite alternate;will-change:transform}
.hero-whale img{display:block;width:100%;height:auto;transform:scaleX(-1);user-select:none;-webkit-user-drag:none}
@keyframes whaleSwim{0%{transform:translateX(-18px) translateY(4px) rotate(-.45deg)}50%{transform:translateX(8px) translateY(-3px) rotate(.2deg)}100%{transform:translateX(34px) translateY(2px) rotate(.5deg)}}
@keyframes whaleRoam{0%{transform:translate3d(-12vw,-10px,0) rotate(-1deg)}28%{transform:translate3d(6vw,18px,0) rotate(.8deg)}56%{transform:translate3d(14vw,-18px,0) rotate(-.3deg)}82%{transform:translate3d(-4vw,22px,0) rotate(.9deg)}100%{transform:translate3d(-15vw,4px,0) rotate(-.6deg)}}
@keyframes whaleNudge{0%{transform:translate3d(-8px,-4px,0) rotate(-.35deg)}100%{transform:translate3d(8px,6px,0) rotate(.35deg)}}
.hero .meta{grid-column:2;grid-row:1 / 4;align-self:start;justify-self:end;width:360px;min-height:0;display:grid;grid-template-columns:1fr;font-size:11px;line-height:1.58;color:var(--text-secondary);border:1px solid var(--draft-line);padding:16px 18px;background:linear-gradient(180deg,transparent,rgb(0 0 0 / .018));position:relative;transform:translate(18px,-14px);transition:width .58s cubic-bezier(.2,.8,.2,1),padding .58s cubic-bezier(.2,.8,.2,1),font-size .58s cubic-bezier(.2,.8,.2,1),line-height .58s cubic-bezier(.2,.8,.2,1),opacity .38s ease,transform .58s cubic-bezier(.2,.8,.2,1)}
.hero .meta::before{content:"";position:absolute;left:18px;right:18px;top:0;border-top:2px solid var(--draft-line-heavy)}
.meta-tag{display:flex;align-items:center;border:0;border-bottom:1px dotted var(--draft-line);padding:0 0 5px;margin-bottom:5px;font-family:var(--font-mono);letter-spacing:.04em;background:transparent}
.meta-tag:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.meta-tag a,.project-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-secondary);text-decoration:none}
.meta-tag a:hover,.project-link:hover{color:var(--print-accent)}
.meta-tag .line-icon,.project-link .line-icon{width:.85rem;height:.85rem}
.content-mode .hero{position:sticky;top:10px;margin:14px auto 10px;padding:24px 42px 34px;grid-template-columns:minmax(0,1fr) 280px;grid-template-rows:auto auto;min-height:150px;overflow:visible;z-index:140}
.content-mode .hero.dynamic-paper{transform:none}
.content-mode .hero h1{font-size:var(--step-3);line-height:1.2}
.content-mode .hero h1::before{margin-bottom:5px}
.content-mode .hero .subtitle{font-size:var(--step--1);line-height:1.7;margin-top:9px}
.content-mode .hero-banner{display:none}
.content-mode .hero .meta{position:absolute;right:28px;top:18px;width:280px;padding:11px 14px;font-size:9.5px;line-height:1.36;opacity:0;transform:translate(16px,-18px) scale(.92);pointer-events:none}
.content-mode .hero .meta::before{left:14px;right:14px}
.content-mode .meta-tag{padding-bottom:3px;margin-bottom:3px}
.content-mode .hero-whale{display:block;position:fixed;left:var(--whale-left,50vw);top:var(--whale-top,126px);width:min(180px,18vw);margin:0;z-index:180;pointer-events:auto;cursor:grab;mix-blend-mode:multiply;opacity:.86;touch-action:none}
.content-mode .hero-whale-art{animation:none;transform:none}
.content-mode .hero-whale.dragging{animation:none;cursor:grabbing;filter:drop-shadow(0 12px 16px rgb(var(--shadow-rgb) / .16))}
.content-mode .hero-whale.user-positioned{animation:none}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:56px 32px}.hero .subtitle{white-space:normal}.hero-banner{grid-column:1;grid-row:auto;margin:32px 0 -8px}.hero-whale{grid-column:1;grid-row:auto;width:min(560px,100%);margin:32px 0 -8px}.hero .meta{grid-column:1;grid-row:auto;justify-self:stretch;width:auto;margin-top:32px;transform:none}.hero h1{font-size:var(--step-3)}.content-mode .hero{grid-template-columns:1fr;padding:24px 28px 32px}.content-mode .hero .meta{display:none}.content-mode .hero-whale{width:150px;top:132px}}
@media(max-width:760px){.draft-edge-label{display:none}.hero{width:calc(100% - 24px)}}
@media(prefers-reduced-motion:reduce){.hero-whale-art{animation:none}}

/* Nav */
.nav{position:sticky;top:12px;z-index:130;width:min(1400px,calc(100% - 100px));margin:0 auto 40px;background:rgb(var(--paper-rgb));padding:12px;display:flex;gap:8px;overflow-x:auto;justify-content:center;flex-wrap:nowrap;box-shadow:0 12px 24px rgb(var(--shadow-rgb) / .08);transition:top .58s cubic-bezier(.2,.8,.2,1),margin .58s cubic-bezier(.2,.8,.2,1),box-shadow .38s ease,opacity .38s ease,transform .38s ease}
.nav button{flex:1;background:transparent;border:0;color:var(--text-secondary);padding:8px;cursor:pointer;font-size:var(--step--1);font-family:var(--font-mono);letter-spacing:.1em;transition:color .2s ease,background-color .2s ease;white-space:nowrap;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.nav button:hover,.nav button.active{background:rgb(var(--paper-cool-rgb) / .72);color:var(--text-primary)}
.content-mode .nav{top:174px;margin-bottom:28px;z-index:135;box-shadow:0 16px 32px rgb(var(--shadow-rgb) / .10)}
@media(max-width:900px){.content-mode .nav{top:166px}}
@media(max-width:760px){.nav,.container{width:calc(100% - 24px)}.nav{justify-content:flex-start}.nav button{flex:0 0 auto}.content-mode .nav{top:158px}}

/* Layout */
.container{width:min(1400px,calc(100% - 100px));margin:0 auto;padding:0 0 100px;position:relative;z-index:1;overflow:hidden;opacity:1;transition:opacity .42s ease,transform .42s cubic-bezier(.2,.8,.2,1)}
.home-mode .container{opacity:0;transform:translateY(12px);max-height:0;padding-bottom:0;pointer-events:none}
.content-mode .container{opacity:1;transform:translateY(0);max-height:none;pointer-events:auto}
section{position:relative;margin-bottom:82px;padding:60px 56px;overflow:hidden;background:linear-gradient(145deg,rgb(var(--paper-rgb)),rgb(var(--paper-cool-rgb) / .66));box-shadow:var(--paper-edge),var(--paper-shadow);transition:transform 140ms ease,opacity .32s ease}
section.section-active{display:block}
section.slide-from-right{animation:paperSlideFromRight .42s cubic-bezier(.2,.8,.2,1)}
section.slide-from-left{animation:paperSlideFromLeft .42s cubic-bezier(.2,.8,.2,1)}
section.section-fade-out{animation:paperFadeOut .24s ease forwards}
@keyframes paperSlideFromRight{from{opacity:0;transform:translateX(7%) rotate(.3deg)}to{opacity:1;transform:translateX(0) rotate(0deg)}}
@keyframes paperSlideFromLeft{from{opacity:0;transform:translateX(-7%) rotate(-.3deg)}to{opacity:1;transform:translateX(0) rotate(0deg)}}
@keyframes paperFadeOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(-3%)}}
section h2{font-family:var(--font-serif);font-size:var(--step-2);font-weight:500;letter-spacing:.05em;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--draft-line);display:flex;align-items:center;gap:.75rem}
section h2::before{content:"FIG.";font-family:var(--font-mono);font-size:10px;color:var(--print-accent);letter-spacing:.15em;margin-right:.25rem;text-shadow:none}
section h2 .icon{color:var(--accent-cyan)}
.line-icon{display:inline-flex;width:1.15rem;height:1.15rem;align-items:center;justify-content:center;flex:0 0 auto;color:currentColor}
.line-icon svg{width:100%;height:100%;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.click-mark{display:inline-flex;color:var(--print-accent);align-items:center;justify-content:center;flex:0 0 auto}
.click-mark .line-icon{width:1rem;height:1rem}
.hero .line-icon{width:1.05rem;height:1.05rem}
.lc-icon .line-icon{width:1.35rem;height:1.35rem}
.fn-title .line-icon{width:1rem;height:1rem;margin-right:.25rem;vertical-align:-.15rem}

/* Defense Layers */
.layers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2.4rem 2.6rem;padding:12px 0}
.layer-card{background:linear-gradient(var(--slip-gradient,180deg),rgb(255 255 255 / .44),var(--slip-bg));border:0;border-radius:0;padding:28px 24px 24px;cursor:pointer;transition:color .2s ease,transform .25s ease,box-shadow .25s ease;position:relative;overflow:hidden;box-shadow:0 12px 28px rgb(var(--shadow-rgb) / .08);transform:rotate(var(--tilt,0deg))}
.layer-card:nth-child(1){--slip-bg:#fcf9f4;--tilt:-1.2deg}.layer-card:nth-child(2){--slip-bg:#f6f2ec;--tilt:.8deg}.layer-card:nth-child(3){--slip-bg:#f1ece5;--tilt:-.5deg}.layer-card:nth-child(4){--slip-bg:#ddd5c9;--tilt:1deg;--slip-gradient:0deg}.layer-card:nth-child(5){--slip-bg:#f6f2ec;--tilt:-.8deg}.layer-card:nth-child(6){--slip-bg:#fcf9f4;--tilt:.6deg}.layer-card:nth-child(7){--slip-bg:#f1ece5;--tilt:-1deg}.layer-card:nth-child(8){--slip-bg:#ddd5c9;--tilt:.9deg;--slip-gradient:0deg}
.layer-card:hover{color:var(--print-accent);transform:translateY(-6px) rotate(var(--tilt,0deg));box-shadow:0 20px 36px rgb(var(--shadow-rgb) / .12)}
.layer-card::before{content:"";position:absolute;left:24px;right:24px;top:20px;border-top:1px solid var(--draft-line);z-index:1}
.layer-card .lc-head{display:flex;align-items:center;gap:.9rem;margin-bottom:.75rem;padding-top:16px}
.layer-card .lc-icon{display:inline-flex}
.layer-card .lc-title{font-family:var(--font-serif);font-weight:500;font-size:var(--step-1);letter-spacing:.03em;flex:1}
.layer-card .lc-desc{font-size:var(--step-0);color:var(--text-secondary);margin-bottom:.9rem}
.layer-card .lc-summary{font-size:var(--step-0);color:var(--text-secondary);border-top:1px solid rgb(var(--ink-rgb) / .22);padding-top:.75rem}
.verdict-badge{font-family:var(--font-mono);font-size:10px;font-weight:500;padding:.14rem .45rem;border-radius:0;text-transform:uppercase;letter-spacing:.1em;background:transparent}
.verdict-PASS,.verdict-OBSERVE,.verdict-FAIL{color:var(--print-accent);border:1px solid var(--print-accent)}

/* Experiment Cards */
.exp-list{display:flex;flex-direction:column;gap:1.2rem}
.exp-card{background:transparent;border:0;border-top:1px solid var(--draft-line);border-radius:0;overflow:visible;transition:color .2s ease}
.exp-card:hover{color:var(--print-accent)}
.exp-header{padding:1.1rem 0;cursor:pointer;display:flex;align-items:center;gap:1rem}
.exp-header .exp-id{font-family:var(--font-mono);font-size:11px;font-weight:500;background:transparent;color:var(--print-accent);padding:.22rem .55rem;border:1px solid var(--print-accent);border-radius:0;min-width:58px;text-align:center}
.exp-header .exp-title{font-family:var(--font-serif);font-weight:500;font-size:var(--step-1);letter-spacing:.03em;flex:1}
.exp-header .exp-verdict{margin-left:auto}
.exp-header .chevron{color:var(--text-muted);transition:transform .2s}
.exp-card.open .chevron{transform:rotate(90deg)}
.exp-body{display:none;padding:.45rem 0 1.4rem 4.4rem;animation:fadeIn .3s}
.exp-card.open .exp-body{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

.exp-section{margin-bottom:1.1rem;display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.exp-section-title{font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--print-accent);text-transform:uppercase;letter-spacing:.15em;margin-bottom:0}
.exp-section-title::after{content:" :";color:var(--text-muted);letter-spacing:0}
.exp-prompt{background:transparent;border:1px solid var(--draft-line-heavy);border-radius:0;padding:1.05rem 1.15rem;font-family:var(--font-mono);font-size:var(--step--1);color:var(--text-primary);white-space:pre-wrap;line-height:1.75;max-height:240px;overflow-y:auto;position:relative}
.exp-prompt .copy-btn{position:absolute;top:.4rem;right:.4rem;background:transparent;border:1px solid var(--draft-line-heavy);color:var(--text-primary);padding:.2rem .5rem;border-radius:0;cursor:pointer;font-size:9px;font-family:var(--font-mono);letter-spacing:.08em}
.exp-prompt .copy-btn{display:flex;align-items:center;gap:4px}
.exp-prompt .copy-btn:hover{color:var(--print-accent);border-color:var(--print-accent)}
.exp-result{font-size:var(--step-0);color:var(--text-secondary);line-height:1.85}
.exp-annotation{background:transparent;border:0;border-left:2px solid var(--print-accent);padding:.2rem 0 .2rem 1rem;border-radius:0;font-size:var(--step-0);color:var(--text-secondary);line-height:1.8}
.canary-list{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.45rem}
.canary-tag{font-family:var(--font-mono);font-size:10px;padding:.12rem .35rem;border-radius:0;background:transparent}
.canary-found{color:var(--print-accent);border:1px dotted var(--print-accent)}
.canary-not-found{color:var(--text-muted);border:1px dotted var(--draft-line-heavy)}
.evidence-badge{font-family:var(--font-mono);font-size:10px;padding:.12rem .35rem;border-radius:0;background:transparent;color:var(--print-accent);border:1px solid var(--print-accent);font-weight:500}

/* Prompt Templates */
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:2.2rem 2.6rem}
.pt-card{background:transparent;border:0;border-top:1px solid var(--draft-line);border-radius:0;padding:1.15rem 0 0;transition:color .2s ease}
.pt-card:hover{color:var(--print-accent)}
.pt-card h3{font-family:var(--font-serif);font-size:var(--step-1);font-weight:500;letter-spacing:.03em;margin-bottom:.55rem}
.pt-card .pt-desc{font-size:var(--step-0);color:var(--text-secondary);margin-bottom:.85rem}
.pt-card .pt-template{background:transparent;border:1px solid var(--draft-line-heavy);border-radius:0;padding:.9rem 1rem;font-family:var(--font-mono);font-size:var(--step--1);color:var(--text-primary);white-space:pre-wrap;margin-bottom:.8rem;max-height:150px;overflow-y:auto;line-height:1.75}
.pt-card .pt-meta{display:flex;gap:.65rem;align-items:center;flex-wrap:wrap}
.risk-badge{font-family:var(--font-mono);font-size:10px;padding:.12rem .38rem;border-radius:0;font-weight:500;text-transform:uppercase;border:1px solid var(--print-accent);background:transparent}
.risk-low,.risk-medium,.risk-high,.risk-none{color:var(--print-accent)}

/* Triggers */
.trigger-section{display:grid;grid-template-columns:1fr 1fr;gap:3rem}
@media(max-width:640px){.trigger-section{grid-template-columns:1fr}}
.trigger-group{background:transparent;border:0;border-top:1px solid var(--draft-line);border-radius:0;padding:1.2rem 0 0}
.trigger-group h3{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.1em;margin-bottom:1rem;padding-bottom:0;border-bottom:0}
.trigger-item{display:flex;align-items:center;gap:.85rem;padding:.35rem 0;border-bottom:0;font-size:var(--step-0)}
.trigger-item:last-child{border:none}
.trigger-item .tt{font-family:var(--font-mono);font-size:var(--step--1);color:var(--text-primary)}
.trigger-item .tz{color:var(--text-muted);font-size:var(--step--1)}

/* Conclusions */
.conclusion-list{display:flex;flex-direction:column;gap:1rem}
.conclusion-item{background:transparent;border:0;border-top:1px solid var(--draft-line);border-radius:0;padding:1rem 0 0;font-size:var(--step-0);display:flex;gap:1rem;align-items:flex-start}
.conclusion-item .ci-num{font-family:var(--font-mono);font-size:var(--step--1);font-weight:500;color:var(--print-accent);min-width:1.8rem}

/* Flow Diagram */
.flow-container{background:transparent;border:0;border-radius:0;padding:0;overflow:visible}
.flow-sheets{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.flow-page{position:relative;overflow:hidden;background:linear-gradient(180deg,rgb(var(--paper-cool-rgb) / .82),rgb(var(--paper-cool-rgb) / .28));padding:32px 36px;box-shadow:none;transition:background-color .2s ease}
.flow-page:nth-child(2){background:linear-gradient(180deg,rgb(241 236 229 / .82),rgb(241 236 229 / .28))}
.flow-page-title{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:var(--print-accent);margin-bottom:18px;padding-bottom:0;border-bottom:0}
.flow-chain{display:flex;align-items:stretch;gap:0;min-width:max-content;justify-content:flex-start;flex-wrap:nowrap;row-gap:1.6rem}
.flow-node{background:transparent;border:0;border-radius:0;padding:0;text-align:left;min-width:140px}
.flow-node .fn-label{font-family:var(--font-mono);font-size:10px;color:var(--print-accent);text-transform:uppercase;letter-spacing:.12em}
.flow-node .fn-title{font-family:var(--font-serif);font-size:var(--step-0);font-weight:500;margin-top:.35rem}
.flow-arrow{color:var(--print-accent);padding:0 .5rem;flex-shrink:0}
.flow-arrow .line-icon,.chevron .line-icon{width:.9rem;height:.9rem}
.flow-node.pass,.flow-node.observe{border-color:var(--draft-line);background:transparent}
.flow-page .flow-arrow{align-self:flex-start;margin-top:28px}

@media(max-width:960px){.flow-sheets{grid-template-columns:1fr}}
@media(max-width:760px){section{padding:40px 28px;margin-bottom:56px}.exp-body{padding-left:0}.layers-grid,.pt-grid{grid-template-columns:1fr;gap:1.8rem}.trigger-section{gap:2rem}}

/* Footer */
footer{width:min(1400px,calc(100% - 100px));margin:0 auto;text-align:center;padding:2rem 1rem;color:var(--text-muted);font-size:var(--step--1);border-top:1px solid var(--border-subtle)}
.home-mode footer{opacity:0;max-height:0;overflow:hidden;padding:0;border-top:0;pointer-events:none}
.project-links{display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;margin-bottom:.5rem}
.project-identity a{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none}
.project-identity a:hover{color:var(--print-accent)}
.project-identity .line-icon{width:.85rem;height:.85rem}
.project-note{margin-top:.3rem}
@media(max-width:760px){footer{width:calc(100% - 24px)}.project-links{justify-content:flex-start;text-align:left}}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgb(var(--ink-rgb) / .22);border-radius:1px}
::-webkit-scrollbar-thumb:hover{background:rgb(var(--ink-rgb) / .36)}

/* Hidden sections */
.section-hidden{display:none}
</style>
</head>

<div class="draft-edge-label">DOCUMENT NO. DGS-001 // DOCKER GORDON BOUNDARY MAP // PUBLIC ARCHIVE</div>

<footer id="project-footer"></footer>

<script>var GORDON_DATA = null;</script>
<script src="gordon-boundary-map.js"></script>

<script>
// ── Data Loading ──
let DATA = null;
const PROJECT_INFO = {
  owner: 'pingqLIN',
  name: 'Docker-Gordon-side',
  branch: 'main',
  siteUrl: 'https://docker-gordon-side.colorgeek.co/',
  repoUrl: 'https://github.com/pingqLIN/Docker-Gordon-side',
  url: 'https://docker-gordon-side.colorgeek.co/',
  readmeUrl: 'https://github.com/pingqLIN/Docker-Gordon-side#readme',
  dataUrl: 'https://github.com/pingqLIN/Docker-Gordon-side/blob/main/gordon-boundary-map.json'
};

async function loadData() {
  // Method 1: Try fetch (works on HTTP servers)
  try {
    const resp = await fetch('gordon-boundary-map.json');
    if (resp.ok) { DATA = await resp.json(); renderAll(); return; }
  } catch(e) { /* fall through */ }
  // Method 2: Try inline GORDON_DATA from .js file
  if (typeof GORDON_DATA !== 'undefined' && GORDON_DATA !== null) {
    DATA = GORDON_DATA;
    renderAll();
    return;
  }
  document.querySelector('.container').innerHTML = '<p style="text-align:center;padding:3rem;color:#8b5d58;">無法載入資料。請用 <code>npx serve</code> 或 Live Server 開啟，或執行 <code>node -e "const d=require(\'./gordon-boundary-map.json\');require(\'fs\').writeFileSync(\'gordon-boundary-map.js\',\'var GORDON_DATA = \'+JSON.stringify(d)+\';\')"</code> 產生 .js 檔案後重新整理。</p>';
}

function renderAll() {
  renderStaticIcons();
  renderMeta();
  renderNav();
  renderFlow();
  renderLayers();
  renderExperiments();
  renderPrompts();
  renderTriggers();
  renderConclusions();
  renderProjectFooter();
  initDynamicPaper();
  initWhaleDrag();
}

function renderStaticIcons() {
  document.querySelector('.hero .mark').innerHTML = lineIcon('map');
  document.querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = lineIcon(el.dataset.icon);
  });
}

// ── Meta ──
function renderMeta() {
  const m = DATA.meta;
  document.getElementById('hero-meta').innerHTML = [
    `<a href="${PROJECT_INFO.siteUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>Official: docker-gordon-side.colorgeek.co</span></a>`,
    `<a href="${PROJECT_INFO.repoUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>GitHub: ${PROJECT_INFO.owner}/${PROJECT_INFO.name}</span></a>`,
    `Branch: ${PROJECT_INFO.branch}`,
    `Docker Desktop ${m.dockerDesktopVersion}`,
    `docker ai ${m.dockerAiVersion}`,
    `Agent ${m.dockerAgentVersion}`,
    `Model: ${m.defaultModel}`,
    `更新: ${m.lastUpdated}`
  ].map(t => `<span class="meta-tag">${t.includes('<a ') ? t : escapeHtml(t)}</span>`).join('');
}

function renderProjectFooter() {
  const footer = document.getElementById('project-footer');
  footer.innerHTML = `
    <div class="project-links">
      <a class="project-link" href="${PROJECT_INFO.siteUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>Official Site</span></a>
      <a class="project-link" href="${PROJECT_INFO.repoUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>GitHub Repository</span></a>
      <a class="project-link" href="${PROJECT_INFO.readmeUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>README</span></a>
      <a class="project-link" href="${PROJECT_INFO.dataUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>Boundary Data JSON</span></a>
    </div>
    <p class="project-identity"><a href="${PROJECT_INFO.siteUrl}" target="_blank" rel="noreferrer">${lineIcon('pointer')}<span>Docker Gordon Side Experiments · ${PROJECT_INFO.siteUrl.replace(/\/$/, '')} · branch ${PROJECT_INFO.branch}</span></a></p>
    <p class="project-note">資料來源：gordon-boundary-map.json · 所有機密字樣均為測試用假資料</p>
  `;
}

// ── Nav ──
const SECTIONS = [
  {id:'sec-flow',label:'防護流程'},
  {id:'sec-layers',label:'防護線'},
  {id:'sec-experiments',label:'實驗記錄'},
  {id:'sec-prompts',label:'提示詞範本'},
  {id:'sec-triggers',label:'觸發語義'},
  {id:'sec-conclusions',label:'結論'}
];
let currentSectionId = null;
let prepareContentWhale = () => {};

function renderNav() {
  const nav = document.getElementById('main-nav');
  nav.innerHTML = SECTIONS.map(s =>
    `<button data-sec="${s.id}"><span class="click-mark">${lineIcon('pointer')}</span><span>${escapeHtml(s.label)}</span></button>`
  ).join('');
  nav.querySelectorAll('button[data-sec]').forEach(button => {
    button.addEventListener('click', () => showSection(button.dataset.sec));
  });
  SECTIONS.forEach(s => document.getElementById(s.id)?.classList.add('section-hidden'));
}

function showSection(id) {
  const hasPrevious = currentSectionId !== null;
  const previousSection = hasPrevious ? document.getElementById(currentSectionId) : null;
  const activate = () => activateSection(id, hasPrevious);
  document.body.classList.remove('home-mode');
  document.body.classList.add('content-mode');
  window.requestAnimationFrame(prepareContentWhale);
  if (previousSection && currentSectionId !== id) {
    previousSection.classList.remove('slide-from-right', 'slide-from-left');
    previousSection.classList.add('section-fade-out');
    window.setTimeout(activate, 240);
    return;
  }
  activate();
}

function activateSection(id, hasPrevious) {
  const previousIndex = Math.max(0, SECTIONS.findIndex(s => s.id === currentSectionId));
  const nextIndex = Math.max(0, SECTIONS.findIndex(s => s.id === id));
  const directionClass = nextIndex >= previousIndex ? 'slide-from-right' : 'slide-from-left';
  SECTIONS.forEach(s => {
    const el = document.getElementById(s.id);
    if (!el) return;
    el.classList.remove('section-active', 'section-fade-out', 'slide-from-right', 'slide-from-left');
    const active = s.id === id;
    el.classList.toggle('section-hidden', !active);
    if (active) {
      el.classList.add('section-active', directionClass);
      el.addEventListener('animationend', () => el.classList.remove(directionClass), {once:true});
    }
  });
  document.querySelectorAll('.nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.sec === id);
  });
  currentSectionId = id;
  if (!hasPrevious) window.setTimeout(() => window.scrollTo({top:0, behavior:'smooth'}), 80);
}

// ── Flow ──
function renderFlow() {
  const chain = document.getElementById('flow-chain');
  const layers = DATA.defenseLayers;
  const groups = [
    {label:'Sheet 01 / Context Boundary', items: layers.slice(0, 4)},
    {label:'Sheet 02 / Governance Boundary', items: layers.slice(4)}
  ];
  chain.innerHTML = `<div class="flow-sheets">${groups.map(group => `
    <div class="flow-page">
      <div class="flow-page-title">${escapeHtml(group.label)}</div>
      <div class="flow-chain">
        ${group.items.map((l, i) => {
          const cls = l.verdict === 'PASS' ? 'pass' : 'observe';
          return (i > 0 ? `<span class="flow-arrow">${lineIcon('arrow')}</span>` : '') +
            `<div class="flow-node ${cls}">
              <div class="fn-label">${escapeHtml(l.id)}</div>
              <div class="fn-title">${lineIcon(l.id)}${escapeHtml(l.name)}</div>
              <span class="verdict-badge verdict-${safeToken(l.verdict)}">${escapeHtml(l.verdict)}</span>
            </div>`;
        }).join('')}
      </div>
    </div>
  `).join('')}</div>`;
}

// ── Layers ──
function renderLayers() {
  const grid = document.getElementById('layers-grid');
  grid.innerHTML = DATA.defenseLayers.map(l => {
    const relatedExps = DATA.experiments.filter(e => e.layer === l.id);
    const layerId = safeToken(l.id);
    return `<div class="layer-card" data-layer-id="${layerId}">
      <div class="lc-head">
        <span class="click-mark">${lineIcon('pointer')}</span>
        <span class="lc-icon">${lineIcon(l.id)}</span>
        <span class="lc-title">${escapeHtml(l.name)}</span>
        <span class="verdict-badge verdict-${safeToken(l.verdict)}">${escapeHtml(l.verdict)}</span>
      </div>
      <div class="lc-desc">${escapeHtml(l.description)}</div>
      <div class="lc-summary">${escapeHtml(l.summary)}</div>
      ${relatedExps.length ? `<div style="margin-top:.5rem;font-size:var(--step--1);color:var(--text-muted)">相關實驗：${relatedExps.map(e=>escapeHtml(e.id)).join(', ')}</div>` : ''}
    </div>`;
  }).join('');
  grid.querySelectorAll('.layer-card[data-layer-id]').forEach(card => {
    card.addEventListener('click', () => filterExperiments(card.dataset.layerId));
  });
}

function filterExperiments(layerId) {
  showSection('sec-experiments');
  // Open matching experiments
  setTimeout(() => {
    document.querySelectorAll('.exp-card').forEach(card => {
      const match = card.dataset.layer === layerId;
      card.classList.toggle('open', match);
      if (match) card.style.order = '-1';
      else card.style.order = '0';
    });
  }, 100);
}

// ── Experiments ──
function renderExperiments() {
  const list = document.getElementById('exp-list');
  list.innerHTML = DATA.experiments.map(exp => `
    <div class="exp-card" data-layer="${safeToken(exp.layer)}" data-id="${safeToken(exp.id)}">
      <div class="exp-header">
        <span class="click-mark">${lineIcon('pointer')}</span>
        <span class="exp-id">${escapeHtml(exp.id)}</span>
        <span class="exp-title">${escapeHtml(exp.title)}</span>
        <span class="evidence-badge">證據 ${escapeHtml(exp.evidenceLevel)}</span>
        <span class="exp-verdict verdict-badge verdict-${safeToken(exp.verdict)}">${escapeHtml(exp.verdict)}</span>
        <span class="chevron">${lineIcon('chevron')}</span>
      </div>
      <div class="exp-body">
        <div class="exp-section">
          <div class="exp-section-title">目的</div>
          <div class="exp-result">${escapeHtml(exp.purpose)}</div>
        </div>
        <div class="exp-section">
          <div class="exp-section-title">提示詞</div>
          <div class="exp-prompt"><button class="copy-btn" data-prompt-id="${safeToken(exp.id)}">${lineIcon('pointer')}<span>複製</span></button><span id="prompt-${safeToken(exp.id)}">${escapeHtml(exp.prompt)}</span></div>
        </div>
        <div class="exp-section">
          <div class="exp-section-title">結果摘要</div>
          <div class="exp-result">${escapeHtml(exp.resultSummary)}</div>
        </div>
        ${exp.canaryFound.length ? `<div class="exp-section">
          <div class="exp-section-title">找到的 CANARY</div>
          <div class="canary-list">${exp.canaryFound.map(c=>`<span class="canary-tag canary-found">${escapeHtml(c)}</span>`).join('')}</div>
        </div>` : ''}
        ${exp.canaryNotFound.length ? `<div class="exp-section">
          <div class="exp-section-title">未找到的 CANARY</div>
          <div class="canary-list">${exp.canaryNotFound.map(c=>`<span class="canary-tag canary-not-found">${escapeHtml(c)}</span>`).join('')}</div>
        </div>` : ''}
        <div class="exp-section">
          <div class="exp-section-title">防護線註釋</div>
          <div class="exp-annotation">${escapeHtml(exp.annotations)}</div>
        </div>
        <div class="exp-section" style="font-size:var(--step--1);color:var(--text-muted)">
          <div class="exp-section-title">工具呼叫</div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
          <span>${exp.toolCalls ? '有' : '無'}</span>
          ${exp.sessionId ? `<span>Session：<code>${escapeHtml(exp.sessionId)}</code></span>` : ''}
          </div>
        </div>
      </div>
    </div>
  `).join('');
  list.querySelectorAll('.exp-header').forEach(header => {
    header.addEventListener('click', () => header.parentElement.classList.toggle('open'));
  });
  list.querySelectorAll('.copy-btn[data-prompt-id]').forEach(button => {
    button.addEventListener('click', event => copyPrompt(event, button.dataset.promptId));
  });
}

// ── Prompts ──
function renderPrompts() {
  const grid = document.getElementById('pt-grid');
  grid.innerHTML = DATA.promptTemplates.map(pt => `
    <div class="pt-card">
      <h3>${escapeHtml(pt.name)}</h3>
      <div class="pt-desc">${escapeHtml(pt.description)}</div>
      <div class="pt-template">${escapeHtml(pt.template)}</div>
      <div class="pt-meta">
        <span class="risk-badge risk-${safeToken(pt.riskLevel)}">${pt.riskLevel === 'low' ? '低風險' : pt.riskLevel === 'medium' ? '中風險' : pt.riskLevel === 'high' ? '高風險' : '無風險'}</span>
        <span style="font-size:var(--step--1);color:var(--text-muted)">${escapeHtml(pt.expectedBehavior)}</span>
      </div>
    </div>
  `).join('');
}

// ── Triggers ──
function renderTriggers() {
  const sec = document.getElementById('trigger-section');
  const ts = DATA.triggerSemantics;
  sec.innerHTML = `
    <div class="trigger-group">
      <h3 style="color:var(--accent-green)">${lineIcon('strong')} 強觸發詞</h3>
      ${ts.strongTriggers.map(t => `
        <div class="trigger-item">
          <span class="tt">${escapeHtml(t.term)}</span>
          <span class="tz">${escapeHtml(t.zhTerm)}</span>
        </div>
      `).join('')}
    </div>
    <div class="trigger-group">
      <h3 style="color:var(--accent-amber)">${lineIcon('weak')} 弱觸發詞</h3>
      ${ts.weakTriggers.map(t => `
        <div class="trigger-item">
          <span class="tt">${escapeHtml(t.term)}</span>
          <span class="tz">${escapeHtml(t.zhTerm)}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// ── Conclusions ──
function renderConclusions() {
  const list = document.getElementById('conclusion-list');
  list.innerHTML = DATA.conclusions.map((c, i) => `
    <div class="conclusion-item">
      <span class="ci-num">${i + 1}.</span>
      <span>${escapeHtml(c)}</span>
    </div>
  `).join('');
}

// ── Helpers ──
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function safeToken(value) {
  return String(value).replace(/[^A-Za-z0-9_-]/g, '_');
}

function safeColor(value) {
  const color = String(value);
  return /^#[0-9A-Fa-f]{6}$/.test(color) ? color : '#748295';
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function applyDynamicPaper(panel, normalizedX, normalizedY) {
  panel.style.setProperty('--dynamic-light-x', `${40 + normalizedX * 34}%`);
  panel.style.setProperty('--dynamic-light-y', `${14 + normalizedY * 18}%`);
  panel.style.setProperty('--tilt-x', `${((normalizedX - 0.5) * 1.4).toFixed(2)}deg`);
  panel.style.setProperty('--tilt-y', `${((0.5 - normalizedY) * 1.1).toFixed(2)}deg`);
}

function resetDynamicPaper(panel) {
  panel.style.setProperty('--dynamic-light-x', '68%');
  panel.style.setProperty('--dynamic-light-y', '22%');
  panel.style.setProperty('--tilt-x', '0deg');
  panel.style.setProperty('--tilt-y', '0deg');
}

function initDynamicPaper() {
  document.querySelectorAll('.hero, main section').forEach(panel => {
    if (panel.dataset.dynamicBound === 'true') return;
    panel.dataset.dynamicBound = 'true';
    panel.classList.add('dynamic-paper');
    panel.addEventListener('pointermove', event => {
      const rect = panel.getBoundingClientRect();
      const normalizedX = clamp((event.clientX - rect.left) / rect.width, 0, 1);
      const normalizedY = clamp((event.clientY - rect.top) / rect.height, 0, 1);
      applyDynamicPaper(panel, normalizedX, normalizedY);
    });
    panel.addEventListener('pointerleave', event => {
      if (event.pointerType === 'mouse') resetDynamicPaper(panel);
    });
    panel.addEventListener('pointercancel', () => resetDynamicPaper(panel));
  });
}

function initWhaleDrag() {
  const whale = document.querySelector('.hero-whale');
  if (!whale || whale.dataset.dragBound === 'true') return;
  whale.dataset.dragBound = 'true';
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  let roamFrame = 0;
  let roamStart = 0;
  let roamBaseLeft = 0;
  let roamBaseTop = 0;

  const setWhalePosition = (left, top) => {
    const rect = whale.getBoundingClientRect();
    const nextLeft = clamp(left, 12, window.innerWidth - rect.width - 12);
    const nextTop = clamp(top, 12, window.innerHeight - rect.height - 12);
    whale.style.setProperty('--whale-left', `${nextLeft}px`);
    whale.style.setProperty('--whale-top', `${nextTop}px`);
    return {left: nextLeft, top: nextTop};
  };

  const readWhalePosition = () => {
    const rect = whale.getBoundingClientRect();
    const leftValue = Number.parseFloat(whale.style.getPropertyValue('--whale-left'));
    const topValue = Number.parseFloat(whale.style.getPropertyValue('--whale-top'));
    return {
      left: Number.isFinite(leftValue) ? leftValue : rect.left,
      top: Number.isFinite(topValue) ? topValue : rect.top
    };
  };

  const resetRoamClock = () => {
    roamStart = performance.now();
  };

  const roamWhale = time => {
    if (!document.body.classList.contains('content-mode')) {
      roamFrame = 0;
      return;
    }

    if (!whale.classList.contains('dragging')) {
      const elapsed = (time - roamStart) / 1000;
      const positioned = whale.classList.contains('user-positioned');
      const rangeX = positioned ? 9 : Math.min(130, Math.max(52, window.innerWidth * 0.07));
      const rangeY = positioned ? 7 : 24;
      setWhalePosition(
        roamBaseLeft + Math.sin(elapsed * 0.38) * rangeX + Math.sin(elapsed * 0.17) * rangeX * 0.28,
        roamBaseTop + Math.sin(elapsed * 0.53) * rangeY
      );
    }

    roamFrame = window.requestAnimationFrame(roamWhale);
  };

  prepareContentWhale = () => {
    if (!document.body.classList.contains('content-mode')) return;
    if (whale.dataset.contentReady !== 'true') {
      const rect = whale.getBoundingClientRect();
      const position = setWhalePosition(window.innerWidth * 0.42, Math.min(138, window.innerHeight - rect.height - 12));
      roamBaseLeft = position.left;
      roamBaseTop = position.top;
      whale.dataset.contentReady = 'true';
    } else if (!whale.classList.contains('dragging')) {
      const position = readWhalePosition();
      roamBaseLeft = position.left;
      roamBaseTop = position.top;
    }
    resetRoamClock();
    if (!roamFrame) roamFrame = window.requestAnimationFrame(roamWhale);
  };

  whale.addEventListener('pointerdown', event => {
    if (!document.body.classList.contains('content-mode')) return;
    const rect = whale.getBoundingClientRect();
    dragOffsetX = event.clientX - rect.left;
    dragOffsetY = event.clientY - rect.top;
    whale.style.setProperty('--whale-left', `${rect.left}px`);
    whale.style.setProperty('--whale-top', `${rect.top}px`);
    whale.classList.remove('user-positioned');
    whale.classList.add('dragging');
    whale.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  whale.addEventListener('pointermove', event => {
    if (!whale.classList.contains('dragging')) return;
    setWhalePosition(event.clientX - dragOffsetX, event.clientY - dragOffsetY);
  });

  const releaseWhale = event => {
    if (!whale.classList.contains('dragging')) return;
    whale.classList.remove('dragging');
    whale.classList.add('user-positioned');
    const position = readWhalePosition();
    roamBaseLeft = position.left;
    roamBaseTop = position.top;
    resetRoamClock();
    if (whale.hasPointerCapture(event.pointerId)) whale.releasePointerCapture(event.pointerId);
  };

  whale.addEventListener('pointerup', releaseWhale);
  whale.addEventListener('pointercancel', releaseWhale);
}

function copyPrompt(e, id) {
  e.stopPropagation();
  const el = document.getElementById('prompt-' + id);
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = e.currentTarget || e.target.closest('button');
    btn.innerHTML = `${lineIcon('pointer')}<span>已複製</span>`;
    setTimeout(() => { btn.innerHTML = `${lineIcon('pointer')}<span>複製</span>`; }, 1500);
  });
}
